name: ncd_screening_mobile
description: "Offline-first Flutter mobile application for 4 Non-Communicable Diseases (NCDs) risk screening, triage, village health analytics, and clinical PDF reporting for Mae Ai Sub-district Health Promotion Hospital."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

flavors:
    local:
      app:
        name: "NCD Screening Local"
        identifier: com.fldp.mobileApp.local
      android:
        applicationId: com.fldp.mobileApp.local
    dev:
      app:
        name: "NCD Screening Dev"
        identifier: com.fldp.mobileApp.dev
      android:
        applicationId: com.fldp.mobileApp.dev
    prod:
      app:
        name: "NCD Screening"
        identifier: com.fldp.mobileApp
      android:
        applicationId: com.fldp.mobileApp

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.23.1
  drift_flutter: ^0.2.5
  pdf: ^3.11.1
  printing: ^5.13.2
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  intl: ^0.20.2
  toastification: ^3.0.2
  dropdown_button2: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:

  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
